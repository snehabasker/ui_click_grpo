[package]
name = "prefix-router"
version = "0.1.0"
edition = "2021"
description = "Prefix-aware request router for OpenAI-compatible LLM servers (consistent hashing with bounded load)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = "0.8"
# plain HTTP/1.1 to localhost replicas: no TLS, so no C build scripts
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
